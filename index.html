<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Guardianes del Bosque</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root { --green:#2d5a1b; --gold:#d4a017; --brown:#5c3d1f; --dark:#0f2a12; }
  * { margin:0; padding:0; box-sizing:border-box; touch-action:none; }
  body { background:#0f2a12; display:flex; flex-direction:column; align-items:center;
    min-height:100vh; font-family:'Bangers',cursive; overflow:hidden; user-select:none; }
  header { width:100%; max-width:480px; display:flex; align-items:center;
    justify-content:space-between; padding:7px 12px 5px;
    border-bottom:2px solid rgba(212,160,23,0.3); flex-shrink:0; }
  .logo { font-size:1.5rem; letter-spacing:0.1em; color:var(--gold);
    text-shadow:2px 2px 0 #000; line-height:1; }
  .logo-sub { font-family:'Share Tech Mono',monospace; font-size:0.38rem;
    letter-spacing:0.2em; color:rgba(212,160,23,0.4); display:block; }
  .hud { display:flex; gap:8px; align-items:center; }
  .hud-box { background:rgba(0,0,0,0.6); border:1px solid rgba(212,160,23,0.3);
    padding:3px 10px; text-align:center; }
  .hud-label { font-family:'Share Tech Mono',monospace; font-size:0.35rem;
    letter-spacing:0.15em; color:#4a5a38; display:block; }
  .hud-val { font-size:1.1rem; color:var(--gold);
    text-shadow:0 0 8px rgba(212,160,23,0.4); display:block; }
  .hp-wrap { display:flex; flex-direction:column; gap:2px; }
  .hp-label { font-family:'Share Tech Mono',monospace; font-size:0.35rem;
    letter-spacing:0.15em; color:#4a5a38; }
  .hp-bar-bg { width:72px; height:10px; background:#1a2a12;
    border:1px solid rgba(212,160,23,0.4); overflow:hidden; }
  #hp-fill { height:100%; width:100%;
    background:linear-gradient(90deg,#2d5a1b,#4a8c2a);
    box-shadow:0 0 6px rgba(212,160,23,0.5); transition:width 0.15s; }
  #canvas-wrap { position:relative; flex-shrink:0; }
  canvas { display:block; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:rgba(15,42,18,0.92); backdrop-filter:blur(4px); z-index:30; }
  #overlay.hidden { display:none; }
  .ov-title { font-size:3rem; letter-spacing:0.12em; color:var(--gold);
    text-shadow:3px 3px 0 #000; margin-bottom:2px; line-height:1; }
  .ov-sub { font-family:'Share Tech Mono',monospace; font-size:0.45rem;
    letter-spacing:0.2em; color:rgba(212,160,23,0.5); margin-bottom:16px; }
  .ov-stats { display:none; gap:12px; margin-bottom:18px; }
  .ov-stats.show { display:flex; }
  .ov-stat { background:rgba(0,0,0,0.5); border:1px solid rgba(212,160,23,0.3);
    padding:8px 14px; text-align:center; }
  .ov-stat-num { font-size:1.6rem; color:var(--gold);
    text-shadow:0 0 10px rgba(212,160,23,0.4); display:block; }
  .ov-stat-label { font-family:'Share Tech Mono',monospace;
    font-size:0.38rem; letter-spacing:0.12em; color:#4a5a38; }
  .ov-btn { font-size:1.1rem; letter-spacing:0.12em; background:var(--gold);
    border:none; color:#0f2a12; padding:10px 30px; cursor:pointer;
    box-shadow:3px 3px 0 #000; }
  .ov-btn:active { transform:translate(2px,2px); box-shadow:1px 1px 0 #000; }
  .ov-hint { font-family:'Share Tech Mono',monospace; font-size:0.4rem;
    letter-spacing:0.15em; color:rgba(74,90,56,0.9); margin-top:10px; }
  #controls { width:100%; max-width:480px; display:flex; align-items:center;
    justify-content:space-between; padding:7px 12px 8px; flex-shrink:0; }
  .ctrl-btn { font-size:1.3rem; background:rgba(0,0,0,0.7);
    border:2px solid rgba(212,160,23,0.4); color:var(--gold);
    width:56px; height:46px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    box-shadow:2px 2px 0 #000; flex-shrink:0; transition:background 0.08s; }
  .ctrl-btn.pressed { background:rgba(212,160,23,0.25); border-color:var(--gold); }
  .ctrl-mid { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .wave-txt { font-size:0.9rem; color:var(--gold); }
  .ammo-txt { font-family:'Share Tech Mono',monospace; font-size:0.42rem;
    color:var(--gold); }
  .gun-txt { font-family:'Share Tech Mono',monospace; font-size:0.36rem;
    color:rgba(212,160,23,0.55); }
</style>
</head>
<body>
<header>
  <div class="logo">GUARDIANES DEL BOSQUE
    <span class="logo-sub">BOSQUE SAGRADO · 10 GUARDIAS · PROTEGE EL ÁRBOL</span>
  </div>
  <div class="hud">
    <div class="hp-wrap">
      <span class="hp-label">VIDA DEL BOSQUE</span>
      <div class="hp-bar-bg"><div id="hp-fill"></div></div>
    </div>
    <div class="hud-box"><span class="hud-label">CORRUPTOS</span><span class="hud-val" id="kills-el">0</span></div>
    <div class="hud-box"><span class="hud-label">MEJOR</span><span class="hud-val" id="hi-el">0</span></div>
  </div>
</header>
<div id="canvas-wrap">
  <canvas id="game"></canvas>
  <div id="overlay">
    <div class="ov-title" id="ov-title">GUARDIANES DEL BOSQUE</div>
    <div class="ov-sub"   id="ov-sub">BOSQUE SAGRADO · PROTEGE EL ÁRBOL</div>
    <div class="ov-stats" id="ov-stats">
      <div class="ov-stat"><span class="ov-stat-num" id="ov-kills">0</span><span class="ov-stat-label">ESPÍRITUS</span></div>
      <div class="ov-stat"><span class="ov-stat-num" id="ov-wave">1</span><span class="ov-stat-label">GUARDIA</span></div>
    </div>
    <button class="ov-btn" onclick="startGame()">▶ INICIAR GUARDIA</button>
    <div class="ov-hint">◀▶ MOVER · 🌿 DISPARAR · ⟳ RECARGAR</div>
  </div>
</div>
<div id="controls">
  <div style="display:flex;gap:6px">
    <button class="ctrl-btn" id="btn-left"
      ontouchstart="pressKey('left')"  ontouchend="releaseKey('left')"
      onmousedown="pressKey('left')"   onmouseup="releaseKey('left')" onmouseleave="releaseKey('left')">◀</button>
    <button class="ctrl-btn" id="btn-right"
      ontouchstart="pressKey('right')" ontouchend="releaseKey('right')"
      onmousedown="pressKey('right')"  onmouseup="releaseKey('right')" onmouseleave="releaseKey('right')">▶</button>
  </div>
  <div class="ctrl-mid">
    <span class="wave-txt" id="wave-el">GUARDIA 1</span>
    <span class="ammo-txt" id="ammo-el">--------</span>
    <span class="gun-txt"  id="gun-el">ARCO</span>
  </div>
  <div style="display:flex;gap:6px">
    <button class="ctrl-btn" id="btn-shoot"
      ontouchstart="pressKey('shoot')" ontouchend="releaseKey('shoot')"
      onmousedown="pressKey('shoot')"  onmouseup="releaseKey('shoot')" onmouseleave="releaseKey('shoot')">🌿</button>
    <button class="ctrl-btn" id="btn-reload"
      ontouchstart="doReload()" ontouchend="void(0)"
      onmousedown="doReload()">⟳</button>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════
// CANVAS
// ════════════════════════════════════════════════════
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const wrap   = document.getElementById('canvas-wrap');
let W=480, H=260, GY=0;

function resize() {
  W = Math.min(window.innerWidth, 480);
  H = Math.round(W * 0.54);
  GY= Math.round(H * 0.80);
  canvas.width=W; canvas.height=H;
  wrap.style.width=W+'px'; wrap.style.height=H+'px';
}
resize();
window.addEventListener('resize', resize);

// ════════════════════════════════════════════════════
// GUARDIAS (10 guardias)
// ════════════════════════════════════════════════════
const GUARDIAS = [
  {pool:[{t:'corruptor',n:4}],                                          reliquia:null,      iv:130},
  {pool:[{t:'corruptor',n:4},{t:'sombra',n:2}],                         reliquia:'baston', iv:115},
  {pool:[{t:'corruptor',n:5},{t:'sombra',n:3}],                         reliquia:null,      iv:100},
  {pool:[{t:'sombra',n:5},{t:'coloso',n:2}],                            reliquia:'lanza',     iv:90 },
  {pool:[{t:'corruptor',n:4},{t:'coloso',n:2},{t:'sombra',n:4}],        reliquia:null,      iv:80 },
  {pool:[{t:'sombra',n:6},{t:'coloso',n:2},{t:'escupidor',n:2}],        reliquia:'cayado',   iv:72 },
  {pool:[{t:'escupidor',n:4},{t:'coloso',n:3},{t:'sombra',n:5}],        reliquia:null,      iv:63 },
  {pool:[{t:'escupidor',n:4},{t:'raizblindada',n:3},{t:'sombra',n:6}],  reliquia:'cetro',     iv:55 },
  {pool:[{t:'raizblindada',n:5},{t:'coloso',n:3},{t:'escupidor',n:5},{t:'sombra',n:4}], reliquia:null, iv:48},
  {pool:[{t:'senor',n:1},{t:'raizblindada',n:3},{t:'escupidor',n:4},{t:'sombra',n:6}], reliquia:null, iv:52},
];

// ════════════════════════════════════════════════════
// ESTADÍSTICAS DE ESPÍRITUS
// ════════════════════════════════════════════════════
function espirituStats(type) {
  const D = {
    corruptor:  {hp:3,  spd:0.55,wf:0.052,hf:0.32,col:'#4a8822',dark:'#2a5510',dmg:8, sc:10, lbl:''},
    sombra:     {hp:2,  spd:1.20,wf:0.042,hf:0.27,col:'#558833',dark:'#336622',dmg:5, sc:15, lbl:''},
    coloso:     {hp:10, spd:0.35,wf:0.080,hf:0.40,col:'#3a7718',dark:'#1a4408',dmg:18,sc:30, lbl:'COLOSO'},
    escupidor:  {hp:3,  spd:0.50,wf:0.048,hf:0.30,col:'#887722',dark:'#554400',dmg:5, sc:20, lbl:'ESCUPE'},
    raizblindada:{hp:8,  spd:0.45,wf:0.060,hf:0.35,col:'#445566',dark:'#223344',dmg:14,sc:35, lbl:'RAÍZ'},
    senor:      {hp:40, spd:0.28,wf:0.115,hf:0.46,col:'#2a6610',dark:'#0a3300',dmg:25,sc:100,lbl:'SEÑOR'},
  };
  const d = D[type]||D.corruptor;
  return {
    type, hp:d.hp, maxHp:d.hp,
    spd: d.spd * W * 0.003,
    w: Math.round(d.wf*W), h: Math.round(d.hf*H),
    col:d.col, dark:d.dark, dmg:d.dmg, score:d.sc, lbl:d.lbl,
  };
}

// ════════════════════════════════════════════════════
// RELIQUIAS
// ════════════════════════════════════════════════════
const RELIQUIAS = {
  arco:    {name:'ARCO',      ammo:8,  reload:80,  cd:20, dmg:1, spread:0, spd:14, col:'#d4a017',r:3, expl:false},
  baston:  {name:'BASTÓN',    ammo:4,  reload:100, cd:35, dmg:2, spread:2, spd:11, col:'#8b5e3c',r:4, expl:false},
  lanza:   {name:'LANZA',     ammo:30, reload:130, cd:5,  dmg:1, spread:1, spd:16, col:'#4a8c2a',r:2, expl:false},
  cayado:  {name:'CAYADO',    ammo:6,  reload:110, cd:28, dmg:4, spread:0, spd:20, col:'#d4a017',r:3, expl:false},
  cetro:   {name:'CETRO',     ammo:3,  reload:180, cd:60, dmg:15,spread:0, spd:8,  col:'#ff8800',r:8, expl:true},
};

// ════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════
let state='start', kills=0, hiScore=parseInt(localStorage.getItem('gb_hi')||'0');
let frameCount=0, animId=null;
let P={};
let reliquiaKey='arco', ammo=8, reloading=false, reloadTmr=0, shootCool=0;
let guardiaIdx=0, spawnQueue=[], spawnTmr=0, guardiaDone=false;
let betweenGuardias=false, betweenTmr=0;
let spirits=[], proyectiles=[], semillaBalls=[], particulas=[];
let arboles=[], ruinas=[];
let keys={};
let waveMsgTmr=0, waveMsgTxt='', gunMsgTmr=0, gunMsgTxt='', flashTmr=0;

document.getElementById('hi-el').textContent = hiScore;

// ════════════════════════════════════════════════════
// INIT GUARDIAN
// ════════════════════════════════════════════════════
function initGuardian() {
  const pw=Math.round(W*0.052), ph=Math.round(H*0.34);
  P = {
    x:Math.round(W*0.18), y:GY-ph,
    w:pw, h:ph,
    hp:100, maxHp:100,
    facing:1, vx:0,
    runF:0, alive:true,
    hurtTmr:0, iframes:0,
  };
}

// ════════════════════════════════════════════════════
// WORLD (BOSQUE)
// ════════════════════════════════════════════════════
function initWorld() {
  arboles=[]; ruinas=[];
  for (let i=0;i<18;i++) arboles.push(mkArbol(-W*0.1+i*W*0.14));
  for (let i=0;i<8;i++)  ruinas.push(mkRuina(W*0.04+i*W*0.14));
}

function mkArbol(x) {
  const layer=Math.floor(Math.random()*3);
  const bw=W*(0.07+Math.random()*0.11), bh=H*(0.2+Math.random()*0.4);
  return {x,w:bw,h:bh,y:GY-bh,layer,
    col:['#1a2a12','#0f1f0a','#152a15'][layer],
    spd:[0.18,0.42,0.72][layer],
    wlits:Array.from({length:24},()=>Math.random()>0.5),
    blinkT:Math.random()*80};
}

function mkRuina(x) {
  const stone=Math.random()>0.45;
  const sw=W*(stone?0.12:0.038), sh=H*(stone?0.135:0.075);
  return {x,w:sw,h:sh,y:GY-sh,
    type:stone?'pilar':'seta',
    col:stone?['#445566','#334455','#556677'][Math.floor(Math.random()*3)]:'#4a8c2a',
    glow:Math.random()>0.65, glowF:Math.random()*Math.PI*2, spd:0.75};
}

// ════════════════════════════════════════════════════
// GUARDIA
// ════════════════════════════════════════════════════
function buildQueue(wData) {
  const q=[];
  wData.pool.forEach(e=>{ for(let i=0;i<e.n;i++) q.push(e.t); });
  for (let i=q.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [q[i],q[j]]=[q[j],q[i]]; }
  return q;
}

function beginGuardia(idx) {
  guardiaIdx=idx; guardiaDone=false; betweenGuardias=false;
  const wd=GUARDIAS[idx];
  spawnQueue=buildQueue(wd);
  spawnTmr=50;

  if (wd.reliquia) {
    reliquiaKey=wd.reliquia; ammo=RELIQUIAS[reliquiaKey].ammo; reloading=false;
    gunMsgTxt=RELIQUIAS[reliquiaKey].name; gunMsgTmr=180;
  }

  waveMsgTxt='GUARDIA '+(idx+1)+(idx===9?' · FINAL!':'');
  waveMsgTmr=110;
  document.getElementById('wave-el').textContent='GUARDIA '+(idx+1);
  updateAmmoUI();
}

function checkClear() {
  if (guardiaDone) return;
  if (spawnQueue.length===0 && spirits.filter(z=>z.alive).length===0) {
    guardiaDone=true;
    if (guardiaIdx>=9) { setTimeout(()=>showEnd(true),900); }
    else { betweenGuardias=true; betweenTmr=180; waveMsgTxt='¡GUARDIA LIMPIA!'; waveMsgTmr=100; }
  }
}

// ════════════════════════════════════════════════════
// SPAWN
// ════════════════════════════════════════════════════
function spawnEspiritu() {
  if (spawnQueue.length===0) return;
  const type=spawnQueue.shift();
  const s=espirituStats(type);
  const right=Math.random()>0.35;
  const sx=right ? W+40+s.w : -40-s.w;
  spirits.push({
    x:sx,
    y:GY-s.h,
    w:s.w, h:s.h,
    hp:s.hp, maxHp:s.maxHp,
    spd:s.spd, col:s.col, dark:s.dark,
    dmg:s.dmg, score:s.score, lbl:s.lbl, type,
    alive:true, hurtTmr:0, atkCool:0, runF:0,
    spitCool:(type==='escupidor'||type==='senor') ? 80+Math.random()*60 : 9999,
  });
}

// ════════════════════════════════════════════════════
// DISPARO
// ════════════════════════════════════════════════════
function shoot() {
  if (!P.alive||reloading||shootCool>0) return;
  if (ammo<=0) { doReload(); return; }
  const g=RELIQUIAS[reliquiaKey];
  const mx = P.facing>0 ? P.x+P.w+2 : P.x-2;
  const my = P.y + Math.round(P.h*0.38);
  if (reliquiaKey==='baston') {
    for (let i=-1;i<=1;i++) mkProyectil(mx,my,g.spd*P.facing,i*1.5,g);
  } else {
    mkProyectil(mx,my,g.spd*P.facing,(Math.random()-0.5)*g.spread,g);
  }
  ammo--; shootCool=g.cd; flashTmr=4;
  updateAmmoUI();
  if (ammo<=0) doReload();
}

function mkProyectil(x,y,vx,vy,g) {
  proyectiles.push({x,y,vx,vy,dmg:g.dmg,r:g.r,col:g.col,expl:g.expl,alive:true,age:0});
}

function doReload() {
  if (reloading||ammo===RELIQUIAS[reliquiaKey].ammo) return;
  reloading=true; reloadTmr=RELIQUIAS[reliquiaKey].reload; updateAmmoUI();
}

function updateAmmoUI() {
  const g=RELIQUIAS[reliquiaKey];
  const ae=document.getElementById('ammo-el'), ge=document.getElementById('gun-el');
  ge.textContent=g.name;
  if (reloading) {
    const pct=1-reloadTmr/g.reload, fill=Math.floor(pct*8);
    ae.textContent='RECARGANDO '+'|'.repeat(fill)+'.'.repeat(8-fill);
    ae.style.color='#8b5e3c';
  } else {
    ae.textContent='●'.repeat(ammo)+'○'.repeat(g.ammo-ammo);
    ae.style.color=ammo<=1?'#cc1122':'#d4a017';
  }
}

// ════════════════════════════════════════════════════
// DAÑO
// ════════════════════════════════════════════════════
function dmgEspiritu(z,dmg) {
  if (z.type==='raizblindada'&&reliquiaKey!=='cetro'&&reliquiaKey!=='cayado') dmg=Math.max(1,Math.floor(dmg/2));
  z.hp-=dmg; z.hurtTmr=8;
  if (z.hp<=0) {
    z.alive=false; kills++;
    if (kills>hiScore) { hiScore=kills; localStorage.setItem('gb_hi',hiScore); document.getElementById('hi-el').textContent=hiScore; }
    document.getElementById('kills-el').textContent=kills;
    spawnHojas(z.x+z.w/2, z.y+z.h/2, 18);
  }
}

function dmgGuardian(dmg) {
  P.hp=Math.max(0,P.hp-dmg); P.hurtTmr=14; P.iframes=35;
  const pct=P.hp/P.maxHp*100;
  document.getElementById('hp-fill').style.width=pct+'%';
  document.getElementById('hp-fill').style.background=
    pct>50?'linear-gradient(90deg,#2d5a1b,#4a8c2a)':
    pct>25?'linear-gradient(90deg,#8b5e3c,#d4a017)':
           'linear-gradient(90deg,#5c3d1f,#8b5e3c)';
  if (P.hp<=0&&P.alive) { P.alive=false; setTimeout(()=>showEnd(false),1000); }
}

function explode(x,y) {
  const rad=W*0.15;
  spirits.forEach(z=>{ if(!z.alive)return;
    const dx=z.x+z.w/2-x,dy=z.y+z.h/2-y;
    if(Math.sqrt(dx*dx+dy*dy)<rad) dmgEspiritu(z,15);
  });
  for(let i=0;i<40;i++){
    const a=Math.random()*Math.PI*2,s=3+Math.random()*9;
    particulas.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,
      r:2+Math.random()*5,col:Math.random()>0.5?'#8b5e3c':'#d4a017',
      life:1,decay:0.035+Math.random()*0.04});
  }
}

function spawnHojas(x,y,n) {
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=2+Math.random()*5;
    particulas.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,
      r:1+Math.random()*3,col:Math.random()>0.3?'#2d5a1b':'#4a8c2a',
      life:1,decay:0.03+Math.random()*0.04});
  }
}

// ════════════════════════════════════════════════════
// UPDATE
// ════════════════════════════════════════════════════
function update() {
  if (state!=='playing') return;
  frameCount++;
  if (shootCool>0)  shootCool--;
  if (flashTmr>0)   flashTmr--;
  if (waveMsgTmr>0) waveMsgTmr--;
  if (gunMsgTmr>0)  gunMsgTmr--;

  if (reloading) {
    reloadTmr--;
    if (reloadTmr%15===0) updateAmmoUI();
    if (reloadTmr<=0) { reloading=false; ammo=RELIQUIAS[reliquiaKey].ammo; updateAmmoUI(); }
  }

  if (betweenGuardias) {
    betweenTmr--;
    if (betweenTmr<=0) { betweenGuardias=false; beginGuardia(guardiaIdx+1); }
  }

  if (!betweenGuardias&&!guardiaDone) {
    spawnTmr--;
    if (spawnTmr<=0&&spawnQueue.length>0) {
      spawnEspiritu();
      spawnTmr=GUARDIAS[guardiaIdx].iv;
    }
  }

  if (P.alive) {
    if (keys.left)       { P.vx=-W*0.0032; P.facing=-1; }
    else if (keys.right) { P.vx= W*0.0032; P.facing= 1; }
    else                   P.vx*=0.55;
    if (keys.shoot) shoot();
    P.x=Math.max(0,Math.min(W-P.w, P.x+P.vx));
    P.y=GY-P.h;
    P.runF += Math.abs(P.vx)>0.5 ? 0.22 : -P.runF*0.3;
    P.runF = Math.max(0,P.runF);
    if (P.hurtTmr>0) P.hurtTmr--;
    if (P.iframes>0) P.iframes--;
  }

  const sc=W*0.0012;
  arboles.forEach(b=>{
    b.x-=sc*b.spd; b.blinkT--;
    if(b.blinkT<=0){b.blinkT=30+Math.random()*90;b.wlits=b.wlits.map(()=>Math.random()>0.5);}
    if(b.x+b.w<-5){const nb=mkArbol(W+5);Object.assign(b,nb);}
  });
  ruinas.forEach(s=>{
    s.x-=sc*s.spd; s.glowF+=0.07;
    if(s.x+s.w<-5){const ns=mkRuina(W+10+Math.random()*W*0.3);Object.assign(s,ns);}
  });

  proyectiles.forEach(b=>{
    if(!b.alive)return;
    b.x+=b.vx; b.y+=b.vy; b.age++;
    if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20||b.age>70){b.alive=false;return;}
    spirits.forEach(z=>{
      if(!z.alive||!b.alive)return;
      if(b.x>z.x&&b.x<z.x+z.w&&b.y>z.y&&b.y<z.y+z.h){
        if(b.expl) explode(b.x,b.y); else spawnHojas(b.x,b.y,6);
        b.alive=false; dmgEspiritu(z,b.dmg);
      }
    });
  });
  proyectiles=proyectiles.filter(b=>b.alive);

  semillaBalls.forEach(s=>{
    if(!s.alive)return;
    s.x+=s.vx; s.y+=s.vy; s.vy+=0.08;
    if(s.x<-10||s.x>W+10||s.y>H+10){s.alive=false;return;}
    if(P.alive&&P.iframes<=0&&s.x>P.x&&s.x<P.x+P.w&&s.y>P.y&&s.y<P.y+P.h){
      dmgGuardian(s.dmg); spawnHojas(s.x,s.y,5); s.alive=false;
    }
  });
  semillaBalls=semillaBalls.filter(s=>s.alive);

  spirits.forEach(z=>{
    if(!z.alive)return;
    if(z.hurtTmr>0)z.hurtTmr--;
    if(z.atkCool>0)z.atkCool--;
    const dx=(P.x+P.w/2)-(z.x+z.w/2);
    z.x+=Math.sign(dx)*z.spd;
    z.y=GY-z.h;
    z.runF+=0.18;

    const ov=z.x<P.x+P.w&&z.x+z.w>P.x&&z.y<P.y+P.h&&z.y+z.h>P.y;
    if(ov&&P.alive&&z.atkCool<=0&&P.iframes<=0){ dmgGuardian(z.dmg); z.atkCool=60; }

    if((z.type==='escupidor'||z.type==='senor')&&P.alive){
      z.spitCool--;
      if(z.spitCool<=0&&Math.abs(dx)>z.w*2){
        const spd=4+Math.random()*2;
        const ang=Math.atan2((P.y+P.h*0.5)-(z.y+z.h*0.38),dx);
        semillaBalls.push({x:z.x+z.w/2,y:z.y+z.h*0.38,
          vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
          dmg:z.type==='senor'?12:5,r:5,alive:true});
        z.spitCool=90+Math.random()*60;
      }
    }
  });

  particulas.forEach(p=>{
    p.x+=p.vx-sc*0.4; p.y+=p.vy; p.vy+=0.12; p.vx*=0.95; p.life-=p.decay;
  });
  particulas=particulas.filter(p=>p.life>0&&p.y<H+10);

  if(!betweenGuardias) checkClear();
}
